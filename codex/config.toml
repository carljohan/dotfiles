# Desktop application preferences
[desktop]
# Appearance
appearanceTheme = "system"
appearanceLightCodeThemeId = "one"
dock-icon-preference = "codex-system"
selected-avatar-id = "fireball"
avatar-overlay-mascot-width-px = 103
usePointerCursors = false

# Conversation behavior
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true
hotkey-window-projectless-default-enabled = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
default-service-tier = "priority"

# Runtime behavior
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true

# Git workflow
git-branch-prefix = "codex/"
git-create-pull-request-as-draft = false
git-pull-request-merge-method = "squash"
git-show-sidebar-pr-icons = true
git-pr-instructions = "Use a Conventional Commit prefix in pull request titles, such as `fix:`, `chore:`, or `feat:`."

[desktop.appearanceLightChromeTheme]
accent = "#526fff"
contrast = 45
ink = "#383a42"
opaqueWindows = true
surface = "#fafafa"

[desktop.appearanceLightChromeTheme.fonts]
ui = "Inter"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#3bba54"
diffRemoved = "#e45649"
skill = "#526fff"

[desktop.open-in-target-preferences]
global = "cursor"

[desktop.open-in-target-preferences.perPath]
"/Users/cj/code/placetide" = "cursor"

# Environment inherited by shell commands and browser integrations.
[shell_environment_policy.set]
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "14e425736668bf21b5b39f2cc022ee8684728617fb5c49f35533c2e349f47193,6d25aa7656feac858f3a3bdaea5bcbab0dbfd426c9de8e6931ce90c399ee8e4f"
