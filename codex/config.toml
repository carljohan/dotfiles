# Model and response behavior
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
suppress_unstable_features_warning = true
web_search = "live"

# Send a desktop notification when a turn finishes.
notify = [
    "/Users/cj/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
    "turn-ended",
]

# Permissions
# Work autonomously inside trusted workspaces and ask before crossing the
# filesystem boundary.
approval_policy = "on-request"
approvals_reviewer = "user"
default_permissions = "trusted-workspace"

[permissions.trusted-workspace]
description = "Full autonomy inside the workspace with public network access."
# Inherits workspace writes, temporary-directory writes, and protection for
# workspace metadata such as .git, .codex, and .agents.
extends = ":workspace"

[permissions.trusted-workspace.filesystem]
# Deny the rest of the filesystem, then reopen only the runtime paths required
# by common developer tools.
":root" = "deny"
":minimal" = "read"

[permissions.trusted-workspace.network]
enabled = true

[permissions.trusted-workspace.network.domains]
# Permit public network access. Local and private network targets remain
# protected by Codex's default local-network guard.
"*" = "allow"

# Trusted projects
[projects."/Users/cj/code/brickanta"]
trust_level = "trusted"

[projects."/Users/cj/code/brickanta-root/brickanta"]
trust_level = "trusted"

[projects."/Users/cj/code/brickanta-workspace/brickanta"]
trust_level = "trusted"

[projects."/Users/cj/code/placetide"]

# Feature overrides
# Memories is experimental and is the only non-default feature enabled here.
[features]
memories = true

[notice]
hide_rate_limit_model_nudge = true

